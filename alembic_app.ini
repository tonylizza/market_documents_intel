# Alembic configuration for the Milestone 7A.1 application/publication
# schema. Deliberately separate from `alembic.ini` (the research schema's
# migration history): a distinct script_location, a distinct AppBase
# metadata (`market_documents.publishing.models`), and a distinct
# `alembic_version` table living inside `app_internal` (see
# `migrations_app/env.py`) so the two histories can never collide, even if
# `APP_DATABASE_URL` is deliberately pointed at the same physical database
# as `DATABASE_URL` for local development.

[alembic]
script_location = %(here)s/migrations_app
prepend_sys_path = .
path_separator = os

# database URL. This is consumed by the user-maintained env.py script only;
# migrations_app/env.py overrides this from Settings.app_database_url.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
